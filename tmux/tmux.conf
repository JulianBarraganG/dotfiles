set-option -sg escape-time 0
set-option -g focus-events on


bind-key -r 'r' source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

set-option -a terminal-features 'xterm-256color:RGB'

bind-key -r C-j resize-pane -U
bind-key -r C-k resize-pane -D
bind-key -r C-h resize-pane -L
bind-key -r C-l resize-pane -R

bind-key f run-shell "tmux neww ~/.local/bin/tms"

# Bind F1-F6 to select/create windows 1-6
bind-key -n F1 if-shell 'tmux list-windows | grep -q "^1:"' 'select-window -t 1' 'new-window -t 1'
bind-key -n F2 if-shell 'tmux list-windows | grep -q "^2:"' 'select-window -t 2' 'new-window -t 2'
bind-key -n F3 if-shell 'tmux list-windows | grep -q "^3:"' 'select-window -t 3' 'new-window -t 3'
bind-key -n F4 if-shell 'tmux list-windows | grep -q "^4:"' 'select-window -t 4' 'new-window -t 4'
bind-key -n F5 if-shell 'tmux list-windows | grep -q "^5:"' 'select-window -t 5' 'new-window -t 5'
bind-key -n F6 if-shell 'tmux list-windows | grep -q "^6:"' 'select-window -t 6' 'new-window -t 6'

# Set panes from 0-index to 1-index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# set vim motions
set -g mode-keys vi
# VTE ignores OSC 52, so pipe selections to the X clipboard directly.
bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'
bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'

bind-key -n F9 run-shell '~/.config/tmux/notes-popup.sh'

bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

set -g mouse on
set-option -g status-position top

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ── palette (edit these once; used everywhere below via #{@name}) ──
set -g @blue   "#82aaff"   # tokyonight-moon blue
set -g @orange "#ff966c"   # tokyonight-moon orange
set -g @green  "#c3e88d"   # tokyonight-moon green
set -g @gray   "colour8"   # dim gray

# ensures status bar is good on reload
set -gu status-format

# ── minimal status bar (inherits terminal theme) ──
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=default fg=#{@gray}'
set -g status-left  ' #[fg=#{@blue}]#S#[fg=#{@gray}] '
set -g status-left-length 30
set -g status-right '#[fg=#{@blue}]%H:%M '
set -g status-right-length 20

# window entries: inactive dim, active gets accent — unless the Claude Code
# session in that window wants attention, in which case @claude_flag holds the
# colour to use (see claude-flag.sh) and @claude_blink_phase dims it mid-pulse.
set -g window-status-format         '#[fg=#{?@claude_flag,#{?@claude_blink_phase,#{@gray},#{@claude_flag}},#{@gray}}] #I #W '
set -g window-status-current-format '#[fg=#{?@claude_flag,#{?@claude_blink_phase,#{@blue},#{@claude_flag}},#{@blue}},bold] #I #W '
set -g window-status-separator ''

# ── Claude Code attention flags ──
# green = a session finished its turn, orange = one is waiting on you. Cleared
# when that session starts working again, or as soon as you look at the window.
#
# Something has to set @claude_flag on the window. Normally that is Claude Code's
# own Stop and Notification hooks in ~/.claude/settings.json, which call
# claude-flag.sh. On a machine where hooks are unavailable, a machine-local
# watcher can poll for the same thing instead — see the source-file at the end.
set -g @claude-blink 'on'             # 'on' pulses flagged windows
set -g @claude-blink-interval '0.6'   # seconds per pulse

set-hook -g after-select-window    'run-shell -b "~/.config/tmux/claude-flag.sh clear #{window_id}"'
set-hook -g pane-focus-in          'run-shell -b "~/.config/tmux/claude-flag.sh clear #{window_id}"'
set-hook -g session-window-changed 'run-shell -b "~/.config/tmux/claude-flag.sh clear #{window_id}"'

# quiet the rest
set -g pane-border-style        'fg=#{@gray}'
set -g pane-active-border-style 'fg=#{@blue}'
set -g message-style            'bg=default fg=#{@orange}'
set -g mode-style               'bg=#{@orange} fg=default'

# session persistence: save/restore across restarts (incl. WSL VM shutdown)
set -g @resurrect-capture-pane-contents 'on'   # restore what was on screen in each pane
set -g @resurrect-restore 'R'                  # restore = prefix + R (frees C-r for your reload binding)
set -g @continuum-restore 'on'                 # auto-restore last saved env when tmux starts
set -g @continuum-save-interval '15'           # auto-save every 15 minutes

# machine-local overrides, kept outside this directory so that `dots` never
# pushes them. -q is silent when the file is absent, which is the normal case.
source-file -q ~/.config/tmux-local/tmux.conf

# init tmux plugin manager
run '~/.config/tmux/plugins/tpm/tpm'
