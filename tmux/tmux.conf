set-option -sg escape-time 0
set-option -g focus-events on


bind-key -r C-r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

set-option -a terminal-features 'xterm-256color:RGB'

bind-key -r C-j resize-pane -U
bind-key -r C-k resize-pane -D
bind-key -r C-h resize-pane -L
bind-key -r C-l resize-pane -R

bind-key f run-shell "tmux neww ~/.local/bin/tms"

# Bind F1-F6 to select/create windows 1-6
bind-key -n F1 if-shell 'tmux list-windows | grep -q "^1:"' 'select-window -t 1' 'new-window -t 1'
bind-key -n F2 if-shell 'tmux list-windows | grep -q "^2:"' 'select-window -t 2' 'new-window -t 2'
bind-key -n F3 if-shell 'tmux list-windows | grep -q "^3:"' 'select-window -t 3' 'new-window -t 3'
bind-key -n F4 if-shell 'tmux list-windows | grep -q "^4:"' 'select-window -t 4' 'new-window -t 4'
bind-key -n F5 if-shell 'tmux list-windows | grep -q "^5:"' 'select-window -t 5' 'new-window -t 5'
bind-key -n F6 if-shell 'tmux list-windows | grep -q "^6:"' 'select-window -t 6' 'new-window -t 6'

# Set panes from 0-index to 1-index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind-key -n F9 run-shell '~/.config/tmux/notes-popup.sh'

bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

set -g mouse on
set-option -g status-position top

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ── minimal status bar (inherits terminal theme; accent = ANSI blue) ──
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=default fg=colour8'
set -g status-left  ' #[fg=#ff966c]#S#[fg=colour8] '
set -g status-left-length 30
set -g status-right '#[fg=colour8]%H:%M '
set -g status-right-length 20

# window entries: inactive dim, active gets accent + subtle bars
set -g window-status-format         '#[fg=colour8] #I #W '
set -g window-status-current-format '#[fg=#ff966c,bold] #I #W '
set -g window-status-separator ''

# quiet the rest
set -g pane-border-style        'fg=colour8'
set -g pane-active-border-style 'fg=#ff966c'
set -g message-style            'bg=default fg=#ff966c'
set -g mode-style               'bg=#ff966c fg=default'

# session persistence: save/restore across restarts (incl. WSL VM shutdown)
set -g @resurrect-capture-pane-contents 'on'   # restore what was on screen in each pane
set -g @resurrect-restore 'R'                  # restore = prefix + R (frees C-r for your reload binding)
set -g @continuum-restore 'on'                 # auto-restore last saved env when tmux starts
set -g @continuum-save-interval '15'           # auto-save every 15 minutes

# init tmux plugin manager
run '~/.config/tmux/plugins/tpm/tpm'
